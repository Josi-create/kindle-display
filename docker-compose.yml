services:
  # Zeichnet das Bild für den Kindle aus den Daten von Home Assistant.
  kindle-anzeige:
    build: .
    image: kindle-anzeige:lokal
    container_name: kindle-anzeige
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    env_file: ha.env
    environment:
      TZ: Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./einstellungen.py:/app/einstellungen.py:ro
    ports:
      - "5000:5000"

  # Nur für iCloud-Kalender nötig: reicht die öffentlichen Kalender repariert an
  # Home Assistant weiter. Nur von diesem Rechner aus erreichbar (127.0.0.1).
  kalender-filter:
    image: python:3.12-slim-bookworm
    container_name: kalender-filter
    restart: unless-stopped
    profiles: ["icloud"]
    command: python -u /app/kalenderfilter.py
    user: "1000:1000"
    read_only: true
    env_file: .env
    volumes:
      - ./kalenderfilter.py:/app/kalenderfilter.py:ro
    ports:
      - "127.0.0.1:5001:5001"
